<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe vs AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
    }

    #status {
      font-size: 18px;
      margin: 15px 0;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px auto;
    }

    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      background: #e9e9e9;
      font-size: 45px;
      font-weight: bold;
      cursor: pointer;
    }

    .cell:hover {
      background: #dcdcdc;
    }

    button#restart {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button#restart:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🎮 Tic-Tac-Toe</h1>

    <div id="status">Giliran kamu (X)</div>

    <div class="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="restart">🔄 Main Lagi</button>
  </div>
